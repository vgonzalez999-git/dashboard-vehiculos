<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Ejecutivo de Vehículos</title>

<style>

:root{
--azul:#0f4c81;
--azul2:#1f6fb2;
--gris:#f3f6fa;
--texto:#1f2937;
--verde:#16a34a;
--rojo:#dc2626;
--ambar:#f59e0b;
}

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:Segoe UI,Arial,sans-serif;
background:var(--gris);
color:var(--texto);
}

header{
background:linear-gradient(135deg,var(--azul),var(--azul2));
color:white;
padding:25px;
box-shadow:0 2px 8px rgba(0,0,0,.15);
}

header h1{
font-size:2rem;
}

.container{
padding:20px;
}

.kpis{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:15px;
margin-bottom:25px;
}

.kpi{
background:white;
padding:20px;
border-radius:14px;
box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.kpi h3{
font-size:.9rem;
