<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Prueba JSON</title>
</head>
<body>

<h1>Prueba JSON</h1>

<div id="resultado">Cargando...</div>

<script>
fetch("vehiculos.json")
.then(r => r.json())
.then(datos => {
  document.getElementById("resultado").innerHTML =
    "Vehículos encontrados: " + datos.length;
});
</script>

</body>
</html>
